services:
  postgres:
    image: postgres:18
    container_name: ums-postgres
    environment:
      POSTGRES_DB: ums_dev
      POSTGRES_USER: ums_user
      POSTGRES_PASSWORD: ums_pass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ums-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ums_user", "-d", "ums_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    image: ums-app:local
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ums_dev
      SPRING_DATASOURCE_USERNAME: ums_user
      SPRING_DATASOURCE_PASSWORD: ums_pass
      JWT_SECRET:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ums-postgres-data:
